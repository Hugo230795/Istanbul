<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit de vol Istanbul</title>
<meta name="description" content="Trois heures de vol sans réseau : turc de survie, quiz Istanbul, jeux, oreille musicale, révisions et étirements.">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1522" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit de vol">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png" type="image/png">
<!-- Polices chargées sans bloquer l'affichage : sans réseau, la page garde ses polices de secours -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
/* Kit de vol : une colonne sur téléphone, grille de cartes sur grand écran ; palette reprise du site du voyage (faïences d'Iznik) */
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --ink: #18233a;
  --muted: #5b6577;
  --line: #dde3ec;
  --cobalt: #1f4fa3;
  --cobalt-ink: #ffffff;
  --tile: #c2412d;
  --turq: #138a83;
  --amber: #b26b12;
  --cobalt-soft: #e6edf9;
  --tile-soft: #fbebe7;
  --turq-soft: #e2f3f1;
  --amber-soft: #f8eedf;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1522; --surface: #172033; --surface-2: #1d2840; --ink: #e8ecf4; --muted: #9aa5b8; --line: #283349;
  --cobalt: #7fa6ef; --cobalt-ink: #0f1522; --tile: #f08a74; --turq: #4cc4bb; --amber: #e3b25a;
  --cobalt-soft: #1c2a47; --tile-soft: #3a2220; --turq-soft: #13302f; --amber-soft: #352a17;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1522; --surface: #172033; --surface-2: #1d2840; --ink: #e8ecf4; --muted: #9aa5b8; --line: #283349;
  --cobalt: #7fa6ef; --cobalt-ink: #0f1522; --tile: #f08a74; --turq: #4cc4bb; --amber: #e3b25a;
  --cobalt-soft: #1c2a47; --tile-soft: #3a2220; --turq-soft: #13302f; --amber-soft: #352a17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.9rem, 7vw, 2.6rem); }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.05rem; font-family: var(--f-body); font-weight: 600; }
p { margin: 0 0 .75em; }
a { color: var(--cobalt); }
small, .muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }

.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { animation: entree .18s ease-out; }
@keyframes entree { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* En-tête */
.entete { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.entete .sur-titre { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tile); font-weight: 600; }
.etat-hors-ligne { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  font-size: .85rem; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.etat-hors-ligne.pret { background: var(--turq-soft); color: var(--turq); font-weight: 600; }
.etat-hors-ligne .point { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

/* Barre de vue (retour + titre) */
.barre { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.retour { min-height: 44px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.barre h2 { flex: 1; }

/* Cartes et blocs */
.grille { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.carte-lien { display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; font: inherit; color: inherit;
  transition: border-color .15s, transform .15s; }
.carte-lien:hover { border-color: var(--cobalt); }
.carte-lien:active { transform: scale(.99); }
.carte-lien .icone { font-size: 1.6rem; line-height: 1; }
.carte-lien .meta { font-size: .85rem; color: var(--muted); }
.carte-lien .record { font-size: .8rem; color: var(--turq); font-weight: 600; }
.section { margin: 28px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bloc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.bloc h3 { margin-bottom: 8px; }

details.bloc > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.bloc > summary::-webkit-details-marker { display: none; }
details.bloc > summary::after { content: "▾"; color: var(--muted); transition: transform .15s; }
details.bloc[open] > summary::after { transform: rotate(180deg); }
details.bloc > summary h3 { margin: 0; }

/* Liste à cocher (ce soir) */
.coches { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; }
.coches label { display: flex; gap: 12px; align-items: flex-start; padding: 8px 4px; cursor: pointer; border-radius: 8px; }
.coches input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--turq); flex: none; }
.coches .detail { display: block; font-size: .88rem; color: var(--muted); }
.coches input:checked + span { opacity: .55; text-decoration: line-through; }

/* Programme */
.programme { list-style: none; margin: 0; padding: 0; position: relative; }
.programme li { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.programme li:first-child { border-top: 0; }
.programme.large li { grid-template-columns: 96px 1fr; }
.programme .heure { font-family: var(--f-mono); font-size: .85rem; color: var(--cobalt); padding-top: 2px; }
.programme button { all: unset; cursor: pointer; color: var(--cobalt); font-weight: 600; }
.programme button:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--cobalt); background: var(--cobalt); color: var(--cobalt-ink);
  font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.btn.fantome { background: transparent; color: var(--cobalt); }
.btn.discret { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.petit { min-height: 38px; padding: 0 12px; font-size: .9rem; }
.rangee { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rangee.centre { justify-content: center; }
.segment { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.segment button { white-space: nowrap; min-height: 40px; padding: 0 12px; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: .9rem; cursor: pointer; }
.segment button + button { border-left: 1px solid var(--line); }
.segment button[aria-pressed="true"] { background: var(--cobalt); color: var(--cobalt-ink); font-weight: 600; }
.champ { min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; width: 100%; }
.champ:focus { outline: 2px solid var(--cobalt); outline-offset: 1px; }

/* Quiz */
.quiz { max-width: 640px; margin: 0 auto; }
.progression { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
.progression > span { display: block; height: 100%; background: var(--cobalt); transition: width .25s; }
.tour { font-size: .9rem; color: var(--tile); font-weight: 600; margin-bottom: 6px; }
.question { font-size: 1.2rem; font-weight: 600; margin-bottom: 14px; }
.choix { display: grid; gap: 8px; }
.choix button { text-align: left; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; touch-action: manipulation; }
.choix button:hover:not([disabled]) { border-color: var(--cobalt); }
.choix button.bon { border-color: var(--turq); background: var(--turq-soft); font-weight: 600; }
.choix button.faux { border-color: var(--tile); background: var(--tile-soft); }
.choix button[disabled] { cursor: default; }
.explication { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: .95rem; }
.explication > strong { display: block; margin-bottom: 2px; }
.score-final { text-align: center; padding: 10px 0 4px; }
.score-final .grand { font-family: var(--f-display); font-size: 3rem; line-height: 1; color: var(--cobalt); }
.tableau-scores { width: 100%; border-collapse: collapse; margin: 12px 0; }
.tableau-scores td { padding: 8px 4px; border-top: 1px solid var(--line); }
.tableau-scores td:last-child { text-align: right; font-family: var(--f-mono); }
.erreurs { margin: 0; padding-left: 18px; font-size: .92rem; }
.erreurs li { margin-bottom: 8px; }
.joueurs { display: grid; gap: 8px; margin: 10px 0; }

/* Turc : fiches */
.fiche { min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  gap: 6px; cursor: pointer; user-select: none; -webkit-user-select: none; position: relative; }
.fiche .mot { font-family: var(--f-display); font-size: clamp(1.7rem, 8vw, 2.4rem); line-height: 1.15; }
.fiche .prono { font-family: var(--f-mono); color: var(--cobalt); font-size: 1rem; }
.fiche .sens { font-size: 1.15rem; font-weight: 600; }
.fiche .indice { font-size: .85rem; color: var(--muted); }
.fiche .cat { position: absolute; top: 10px; left: 14px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.parler { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 0 12px; font: inherit; font-size: .9rem; cursor: pointer; }
.regles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 10px 0 0; }
.regle { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.regle b { font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; color: var(--tile); margin-right: 6px; }
.lexique { width: 100%; border-collapse: collapse; font-size: .95rem; }
.lexique td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.lexique td:first-child { font-weight: 600; }
.lexique .prono { font-family: var(--f-mono); color: var(--cobalt); font-size: .85rem; }
.prix { font-family: var(--f-display); font-size: clamp(1.5rem, 7vw, 2.1rem); line-height: 1.2; margin: 6px 0; }
.etiquette { display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); font-weight: 600; }

/* Jeux */
.jeu { max-width: 520px; margin: 0 auto; }
.infos-jeu { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; font-size: .95rem; }
.infos-jeu .valeur { font-family: var(--f-mono); font-weight: 600; }

.sudoku { display: grid; grid-template-columns: repeat(9, 1fr); width: 100%; aspect-ratio: 1; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--surface); touch-action: manipulation; }
.sudoku button { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); color: var(--cobalt);
  font: inherit; font-size: clamp(1rem, 5.2vw, 1.5rem); padding: 0; cursor: pointer; position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.sudoku button.fixe { color: var(--ink); font-weight: 600; }
.sudoku button.c3 { border-right: 2px solid var(--ink); }
.sudoku button.l3 { border-bottom: 2px solid var(--ink); }
.sudoku button.zone { background: var(--surface-2); }
.sudoku button.meme { background: var(--cobalt-soft); }
.sudoku button.actif { background: var(--cobalt); color: var(--cobalt-ink); }
.sudoku button.erreur { color: var(--tile); background: var(--tile-soft); }
.sudoku .notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font-size: clamp(.45rem, 2vw, .62rem); color: var(--muted); line-height: 1; font-weight: 400; }
.sudoku .notes span { display: flex; align-items: center; justify-content: center; }
.pave { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-top: 12px; }
.pave button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 1.25rem; font-weight: 600; cursor: pointer; touch-action: manipulation; padding: 0; }
.pave button .reste { display: block; font-size: .6rem; color: var(--muted); font-weight: 400; }
.pave button.epuise { opacity: .35; }

.p2048 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; border-radius: 14px; background: var(--surface-2); aspect-ratio: 1; touch-action: none; user-select: none; -webkit-user-select: none; }
.p2048 div { border-radius: 8px; background: var(--surface); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: clamp(1.1rem, 7vw, 2rem); font-family: var(--f-body); }
.p2048 div.neuf { animation: apparait .16s ease-out; }
@keyframes apparait { from { transform: scale(.6); } to { transform: scale(1); } }
.p2048 .v2 { background: #e6edf9; color: #18233a; } .p2048 .v4 { background: #cfdcf3; color: #18233a; }
.p2048 .v8 { background: #9fc0ea; color: #18233a; } .p2048 .v16 { background: #5d90d8; color: #fff; }
.p2048 .v32 { background: #1f4fa3; color: #fff; } .p2048 .v64 { background: #138a83; color: #fff; }
.p2048 .v128 { background: #2aa89f; color: #fff; font-size: clamp(1rem, 6vw, 1.7rem); } .p2048 .v256 { background: #e3b25a; color: #18233a; font-size: clamp(1rem, 6vw, 1.7rem); }
.p2048 .v512 { background: #b26b12; color: #fff; font-size: clamp(1rem, 6vw, 1.7rem); } .p2048 .v1024 { background: #c2412d; color: #fff; font-size: clamp(.9rem, 5vw, 1.4rem); }
.p2048 .v2048 { background: #8e2a1c; color: #fff; font-size: clamp(.9rem, 5vw, 1.4rem); } .p2048 .vmax { background: #18233a; color: #fff; font-size: clamp(.8rem, 4.5vw, 1.2rem); }

.mines-cadre { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.mines { display: grid; gap: 2px; margin: 0 auto; width: max-content; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.mines button { width: var(--case, 32px); height: var(--case, 32px); padding: 0; border: 0; border-radius: 5px; background: var(--cobalt-soft);
  color: var(--ink); font: inherit; font-weight: 700; font-size: calc(var(--case, 32px) * .5); cursor: pointer; -webkit-touch-callout: none; }
.mines button.ouverte { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.mines button.mine { background: var(--tile); color: #fff; }
.mines button.drapeau { background: var(--amber-soft); }
.mines .n1 { color: #1f4fa3; } .mines .n2 { color: #138a83; } .mines .n3 { color: #c2412d; } .mines .n4 { color: #6b3fa0; }
.mines .n5 { color: #8e2a1c; } .mines .n6 { color: #0f6b66; } .mines .n7 { color: #18233a; } .mines .n8 { color: #5b6577; }
:root[data-theme="dark"] .mines .n1, :root[data-theme="dark"] .mines .n7 { color: #7fa6ef; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mines .n1, :root:not([data-theme="light"]) .mines .n7 { color: #7fa6ef; } }

.message-jeu { text-align: center; font-weight: 600; min-height: 1.6em; margin: 10px 0; }
.message-jeu.gagne { color: var(--turq); }
.message-jeu.perdu { color: var(--tile); }

/* Oreille */
.gros-bouton { width: 100%; min-height: 64px; font-size: 1.1rem; }
.astuce { font-size: .9rem; color: var(--muted); }
.reponses { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
.reponses button { min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: .92rem; cursor: pointer; padding: 6px 8px; touch-action: manipulation; }
.reponses button.bon { border-color: var(--turq); background: var(--turq-soft); font-weight: 600; }
.reponses button.faux { border-color: var(--tile); background: var(--tile-soft); }
.compteur { font-family: var(--f-mono); }
.tap { width: 100%; min-height: 150px; border-radius: 18px; border: 2px dashed var(--cobalt); background: var(--cobalt-soft); color: var(--cobalt);
  font: inherit; font-size: 1.3rem; font-weight: 700; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.tap:active { background: var(--cobalt); color: var(--cobalt-ink); }
.bpm { font-family: var(--f-display); font-size: 3.2rem; line-height: 1; color: var(--cobalt); text-align: center; margin: 14px 0 4px; }
.sections-morceau { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 10px; }
.sections-morceau td, .sections-morceau th { padding: 6px 4px; border-top: 1px solid var(--line); text-align: left; }
.sections-morceau th { font-weight: 600; color: var(--muted); font-size: .8rem; }
.sections-morceau input { width: 100%; min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; padding: 0 8px; }

/* Étirements */
.minuteur { text-align: center; }
.minuteur .nom { font-family: var(--f-display); font-size: 1.6rem; margin: 6px 0; }
.minuteur .temps { font-family: var(--f-mono); font-size: 3.4rem; line-height: 1; color: var(--cobalt); margin: 12px 0; }
.minuteur .consigne { max-width: 460px; margin: 0 auto 14px; }
.etapes { display: flex; gap: 4px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
.etapes span { width: 22px; height: 6px; border-radius: 3px; background: var(--surface-2); }
.etapes span.fait { background: var(--turq); }
.etapes span.encours { background: var(--cobalt); }

.pied { margin-top: 40px; font-size: .85rem; color: var(--muted); text-align: center; }

@media (min-width: 720px) {
  .entete { flex-direction: row; align-items: flex-end; justify-content: space-between; }
  .wrap { padding-block-start: 32px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.sans-voix .parler { display: none; }

</style>
</head>
<body>
<main id="app" class="wrap"><noscript>Cette page a besoin de JavaScript.</noscript></main>
<script>
// Contenu du kit : vocabulaire turc, lieux à prononcer, questions des quiz, étirements.
// Prononciation écrite à la française, comme dans le lexique du site du voyage.

const TURC = [
  // Politesse
  { tr: "Merhaba", pr: "mèr-ha-ba", fr: "Bonjour (à toute heure)", cat: "Politesse" },
  { tr: "Günaydın", pr: "gu-naï-deun", fr: "Bonjour (le matin)", cat: "Politesse" },
  { tr: "İyi akşamlar", pr: "i-yi ak-cham-lar", fr: "Bonsoir", cat: "Politesse" },
  { tr: "Teşekkürler", pr: "té-ché-ku-lèr", fr: "Merci", cat: "Politesse" },
  { tr: "Teşekkür ederim", pr: "té-ché-kur é-dé-rim", fr: "Merci (plus poli)", cat: "Politesse" },
  { tr: "Lütfen", pr: "lut-fèn", fr: "S'il vous plaît", cat: "Politesse" },
  { tr: "Evet", pr: "é-vèt", fr: "Oui", cat: "Politesse" },

function h(tag, props, ...enfants) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const e of enfants.flat(Infinity)) {
    if (e == null || e === false) continue;
    el.append(e.nodeType ? e : String(e));
  }
  return el;
}

function melange(liste) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const auHasard = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
const deuxChiffres = n => String(n).padStart(2, "0");
const duree = s => `${Math.floor(s / 60)}:${deuxChiffres(Math.floor(s % 60))}`;

// La mémoire du navigateur peut être absente (navigation privée, aperçu) : on continue sans.
const memoire = {
  lire(cle, defaut) {
    try { const v = localStorage.getItem("kitvol:" + cle); return v == null ? defaut : JSON.parse(v); }
    catch (e) { return defaut; }
  },
  ecrire(cle, valeur) {
    try { localStorage.setItem("kitvol:" + cle, JSON.stringify(valeur)); } catch (e) { /* sans mémoire */ }
  }
};

// Records : on garde le meilleur, au sens de mieux(nouveau, ancien).
function noterRecord(cle, valeur, mieux) {
  const ancien = memoire.lire("record:" + cle, null);
  if (ancien == null || mieux(valeur, ancien)) { memoire.ecrire("record:" + cle, valeur); return true; }
  return false;
}
const lireRecord = cle => memoire.lire("record:" + cle, null);

// Voix turque de l'appareil (présente sur iPhone) : seulement les voix locales, qui marchent sans réseau.
const voix = { turque: null };
function chercherVoix() {
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices().filter(x => /^tr/i.test(x.lang) && x.localService !== false);
  voix.turque = v[0] || null;
  document.documentElement.classList.toggle("sans-voix", !voix.turque);
}
function parler(texte) {

  u.voice = voix.turque; u.lang = voix.turque.lang; u.rate = 0.85;
  speechSynthesis.speak(u);
}
const boutonParler = texte => h("button", { class: "parler", type: "button", onclick: e => { e.stopPropagation(); parler(texte); }, "aria-label": "Écouter " + texte }, "🔊 Écouter");

// Moteur de quiz : seul, ou à plusieurs en se passant le téléphone.
KIT.quiz = function ({ cle, titre, retour, intro, max, fabriquer }) {
  const zone = h("div", { class: "quiz" });
  const reglages = memoire.lire("reglages-quiz", { n: 10, plusieurs: false, noms: ["Joueur 1", "Joueur 2"] });
  depart();
  return h("div", null, barre(titre, retour), zone);

  function depart() {
    const rec = lireRecord(cle);
    const tailles = [10, 20].filter(n => n < max).map(n => [n, String(n)]).concat([[max, `Toutes (${max})`]]);
    if (!tailles.some(t => t[0] === reglages.n)) reglages.n = tailles[0][0];
    const listeNoms = h("div", { class: "joueurs" });
    const majNoms = () => {
      listeNoms.replaceChildren(...reglages.noms.map((nom, i) => h("input", {
        class: "champ", value: nom, maxlength: "20", "aria-label": `Nom du joueur ${i + 1}`,
        oninput: e => { reglages.noms[i] = e.target.value; }
      })), h("div", { class: "rangee" },
        reglages.noms.length < 4 && h("button", { class: "btn petit discret", type: "button", onclick: () => { reglages.noms.push(`Joueur ${reglages.noms.length + 1}`); majNoms(); } }, "+ Un joueur"),
        reglages.noms.length > 2 && h("button", { class: "btn petit discret", type: "button", onclick: () => { reglages.noms.pop(); majNoms(); } }, "− Un joueur")));
      listeNoms.hidden = !reglages.plusieurs;
    };
    majNoms();
    zone.replaceChildren(
      h("div", { class: "bloc" },
        h("p", null, intro),
        rec && h("p", { class: "muted" }, `Ton record : ${rec.score} / ${rec.total}`),
        h("h3", null, "Nombre de questions"),
        segment(tailles, reglages.n, v => { reglages.n = v; }),
        h("h3", { style: "margin-top:16px" }, "Joueurs"),
        segment([[false, "Seul"], [true, "À plusieurs"]], reglages.plusieurs, v => { reglages.plusieurs = v; majNoms(); }),
        listeNoms),
      h("button", { class: "btn gros-bouton", type: "button", onclick: commencer }, "Commencer"));
  }

  function commencer() {
    reglages.noms = reglages.noms.map((n, i) => n.trim() || `Joueur ${i + 1}`);
    memoire.ecrire("reglages-quiz", reglages);
    const joueurs = reglages.plusieurs ? reglages.noms.slice() : ["Toi"];
    let n = Math.min(reglages.n, max);
    if (joueurs.length > 1) n = Math.max(joueurs.length, n - (n % joueurs.length));
    jouer(fabriquer(n), joueurs);
  }

  function jouer(questions, joueurs) {
    const scores = joueurs.map(() => 0);
    const erreurs = [];
    let i = 0;
    poser();

    function poser() {
      const q = questions[i];
      const joueur = i % joueurs.length;
      const bonne = q.r[0];
      const suite = h("div");
      const choix = melange(q.r).map(texte => h("button", { type: "button", onclick: e => repondre(e.currentTarget, texte) }, texte));
      zone.replaceChildren(
        h("div", { class: "progression", "aria-hidden": "true" }, h("span", { style: `width:${(i / questions.length) * 100}%` })),
        h("p", { class: "muted", style: "margin:0 0 4px" }, `Question ${i + 1} sur ${questions.length}`),
        joueurs.length > 1 ? h("p", { class: "tour" }, `À toi, ${joueurs[joueur]}`) : "",
        h("p", { class: "question" }, q.q),
        h("div", { class: "choix" }, choix),
        suite);

      function repondre(bouton, texte) {
        choix.forEach(b => { b.disabled = true; if (b.textContent === bonne) b.classList.add("bon"); });
        const juste = texte === bonne;
        if (juste) scores[joueur]++;
        else { bouton.classList.add("faux"); erreurs.push({ q: q.q, bonne, joueur: joueurs[joueur] }); }
        const derniere = i === questions.length - 1;
        const suivant = h("button", { class: "btn", type: "button", style: "margin-top:12px", onclick: () => { i++; derniere ? fin() : poser(); } }, derniere ? "Voir le score" : "Suivante →");
        suite.replaceChildren(
          h("div", { class: "explication", role: "status" },
            h("strong", null, juste ? "Bonne réponse" : `Réponse : ${bonne}`),
            q.e, q.parler && voix.turque && h("div", { style: "margin-top:8px" }, boutonParler(q.parler))),
          suivant);
        suivant.focus({ preventScroll: true });
        suite.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    function fin() {
      const total = questions.length / joueurs.length;
      let entete;
      if (joueurs.length === 1) {
        const s = scores[0];
        const nouveau = noterRecord(cle, { score: s, total }, (a, b) => a.score / a.total > b.score / b.total || (a.score / a.total === b.score / b.total && a.total > b.total));
        const mot = s === total ? "Parfait !" : s / total >= 0.8 ? "Très bien" : s / total >= 0.5 ? "Pas mal" : "À retravailler";
        entete = h("div", { class: "score-final" },
          h("div", { class: "grand" }, `${s} / ${total}`), h("p", null, mot + (nouveau ? " · nouveau record" : "")));
      } else {
        const classement = joueurs.map((nom, k) => ({ nom, s: scores[k] })).sort((a, b) => b.s - a.s);
        const egalite = classement[0].s === classement[1].s;
        entete = h("div", null,
          h("div", { class: "score-final" }, h("p", { class: "question" }, egalite ? "Égalité en tête !" : `Bravo, ${classement[0].nom} !`)),
          h("table", { class: "tableau-scores" }, h("tbody", null, classement.map(c => h("tr", null, h("td", null, c.nom), h("td", null, `${c.s} / ${total}`))))));
      }
      zone.replaceChildren(
        h("div", { class: "bloc" }, entete),
        erreurs.length === 0 ? "" : h("div", { class: "bloc" }, h("h3", null, "À revoir"),
          h("ul", { class: "erreurs" }, erreurs.map(er => h("li", null, er.q, h("br"), h("strong", null, er.bonne), joueurs.length > 1 ? ` (${er.joueur})` : "")))),
        h("div", { class: "rangee" },
          h("button", { class: "btn", type: "button", onclick: commencer }, "Rejouer"),
          h("button", { class: "btn fantome", type: "button", onclick: depart }, "Réglages"),
          h("button", { class: "btn fantome", type: "button", onclick: () => aller(retour) }, "Retour")));
    }
  }
};

KIT.horsLigne = { texte: "Vérification du mode hors ligne…", pret: false, abonnes: new Set() };

      h("div", { class: "rangee centre" }, annuler, h("button", { class: "btn petit", type: "button", onclick: nouvelle }, "Nouvelle partie")),

  const suivant = h("button", { class: "btn fantome", type: "button", hidden: true, onclick: () => nouvelle() }, "Suivant →");
  function maj() { compteur.textContent = total ? `${bonnes} / ${total} · série en cours : ${serie}` : "Appuie sur Écouter pour commencer"; }
  function dessinerReponses() {
    grille.replaceChildren(...reponses().map(r => h("button", { type: "button", "data-valeur": String(r.valeur), disabled: !question, onclick: e => repondre(e.currentTarget, r) }, r.libelle)));
  }
  function nouvelle() {
    question = tirer(); repondu = false; suivant.hidden = true; retour.replaceChildren();
    dessinerReponses();
    ecouter.textContent = "↻ Réécouter";
    jouer(question);
  }
  function repondre(bouton, r) {
    if (!question || repondu) return;
    repondu = true; total++;
    const juste = r.valeur === question.valeur;
    [...grille.children].forEach(b => { b.disabled = true; if (b.dataset.valeur === String(question.valeur)) b.classList.add("bon"); });
    if (juste) { bonnes++; serie++; noterRecord("serie-" + cle, serie, (a, b) => a > b); }
    else { serie = 0; bouton.classList.add("faux"); }
    retour.replaceChildren(h("div", { class: "explication" }, h("strong", null, juste ? "Bien entendu" : "Pas tout à fait"), expliquer(question)));
    suivant.hidden = false; suivant.focus({ preventScroll: true });
    maj();
  }
  maj(); dessinerReponses();
  zone.replaceChildren(reglages, ecouter, grille, retour, h("div", { class: "rangee centre", style: "margin-top:10px" }, suivant), compteur);
  return { reinitialiser: () => { question = null; ecouter.textContent = "▶ Écouter"; retour.replaceChildren(); suivant.hidden = true; dessinerReponses(); } };
}

KIT.vues.intervalles = function () {
  let niveau = memoire.lire("intervalles-niveau", "facile"), sens = memoire.lire("intervalles-sens", "montant");
  const zone = h("div", { class: "jeu" });
  let partie;
  const reglages = h("div", { class: "bloc" },
    h("div", { class: "rangee" }, segment([["facile", "Facile"], ["moyen", "Moyen"], ["complet", "Tous"]], niveau, v => { niveau = v; memoire.ecrire("intervalles-niveau", v); partie.reinitialiser(); })),
    h("div", { class: "rangee", style: "margin-top:8px" }, segment([["montant", "Montant"], ["descendant", "Descendant"], ["ensemble", "Ensemble"]], sens, v => { sens = v; memoire.ecrire("intervalles-sens", v); })),
    h("p", { class: "astuce", style: "margin:8px 0 0" }, "Facile : tierce majeure, quinte, octave. Chante la première note dans ta tête, puis cherche la chanson qui commence pareil."));
  partie = entrainement({
    cle: "intervalles", zone, reglages,
    tirer: () => ({ valeur: melange(NIVEAUX_INTERVALLES[niveau])[0], base: auHasard(53, 67) }),
    jouer: q => {
      const haute = q.base + q.valeur;
      if (sens === "ensemble") { jouerNote(q.base, 0, 1.6); jouerNote(haute, 0, 1.6); }
      else if (sens === "descendant") { jouerNote(haute, 0); jouerNote(q.base, 0.7); }
      else { jouerNote(q.base, 0); jouerNote(haute, 0.7); }
    },
    reponses: () => INTERVALLES.filter(i => NIVEAUX_INTERVALLES[niveau].includes(i.n)).map(i => ({ valeur: i.n, libelle: i.nom })),
    expliquer: q => { const i = INTERVALLES.find(x => x.n === q.valeur); return `${i.nom} : ${i.n} demi-ton${i.n > 1 ? "s" : ""}. Repère : ${i.repere}.`; }
  });
  return h("div", null, barre("Intervalles", "oreille"), zone);
};

KIT.vues.accords = function () {
  let niveau = memoire.lire("accords-niveau", "triades");
  const zone = h("div", { class: "jeu" });
  let partie;
  const liste = () => niveau === "triades" ? ACCORDS.slice(0, 4) : ACCORDS;
  const reglages = h("div", { class: "bloc" },
    segment([["triades", "Accords de 3 notes"], ["septiemes", "Avec les septièmes"]], niveau, v => { niveau = v; memoire.ecrire("accords-niveau", v); partie.reinitialiser(); }),
    h("p", { class: "astuce", style: "margin:8px 0 0" }, "L'accord est joué note par note, puis plaqué. Commence par trancher : majeur (clair) ou mineur (sombre) ?"));
  partie = entrainement({
    cle: "accords", zone, reglages,
    tirer: () => ({ valeur: melange(liste())[0].nom, base: auHasard(50, 62) }),
    jouer: q => {
      const a = ACCORDS.find(x => x.nom === q.valeur);
      a.notes.forEach((n, k) => jouerNote(q.base + n, k * 0.35, 1));
      const plaque = a.notes.length * 0.35 + 0.25;
      a.notes.forEach(n => jouerNote(q.base + n, plaque, 1.8, 0.16));
    },
    reponses: () => liste().map(a => ({ valeur: a.nom, libelle: a.nom })),
    expliquer: q => { const a = ACCORDS.find(x => x.nom === q.valeur); return `${a.nom} : ${a.texte}.`; }
  });
  return h("div", null, barre("Accords", "oreille"), zone);
};

const TEMPOS = [
  { bpm: 72, style: "trap en demi-tempo (ressenti)" }, { bpm: 88, style: "boom bap" }, { bpm: 95, style: "boom bap rapide" },
  { bpm: 110, style: "house lente, afro" }, { bpm: 122, style: "house" }, { bpm: 128, style: "techno, tech house" },
  { bpm: 135, style: "techno rapide" }, { bpm: 142, style: "trap (compté en entier), techno dure" },
  { bpm: 150, style: "hard techno, schranz classique" }, { bpm: 160, style: "schranz actuelle" }
];
KIT.vues.tempo = function () {
  const zone = h("div", { class: "jeu" });
  let boucle = null;
  const arreter = () => { if (boucle) { boucle.forEach(n => { try { n.stop(); } catch (e) { /* déjà fini */ } }); boucle = null; } };
  KIT.nettoyages.push(arreter);
  const reglages = h("div", { class: "bloc" }, h("p", { style: "margin:0" }, "Quatre mesures de kick et de charleston. À quel tempo ? Compte les kicks sur 15 secondes et multiplie par 4, ou fie-toi à ton corps."));
  let choixCourants = [];
  entrainement({
    cle: "tempo", zone, reglages,
    tirer: () => {
      const cible = melange(TEMPOS)[0];
      const autres = melange(TEMPOS.filter(t => Math.abs(t.bpm - cible.bpm) >= 12));
      const pris = [cible];
      for (const t of autres) { if (pris.length === 4) break; if (pris.every(x => Math.abs(x.bpm - t.bpm) >= 12)) pris.push(t); }
      choixCourants = pris.sort((a, b) => a.bpm - b.bpm);
      return { valeur: cible.bpm };
    },
    jouer: q => {
      const c = KIT.audio(); if (!c) return;
      arreter();
      const temps = 60 / q.valeur, t0 = c.currentTime + 0.08;
      boucle = [];
      for (let k = 0; k < 16; k++) boucle.push(jouerKick(t0 + k * temps, c), jouerCharley(t0 + k * temps + temps / 2, c));
    },
    reponses: () => (choixCourants.length ? choixCourants : TEMPOS.slice(0, 4)).map(t => ({ valeur: t.bpm, libelle: `${t.bpm} BPM` })),
    expliquer: q => { const t = TEMPOS.find(x => x.bpm === q.valeur); return `${t.bpm} BPM : ${t.style}. Une mesure dure ${(240 / t.bpm).toFixed(2).replace(".", ",")} s.`; }
  });
  return h("div", null, barre("Devine le tempo", "oreille"), zone);
};

// Écoute active : tempo tapé au doigt et plan du morceau, pendant que la musique joue dans une autre appli.
KIT.vues.ecoute = function () {
  const sauve = memoire.lire("ecoute", { titre: "", bpm: 0, sections: [] });
  let frappes = [], bpm = sauve.bpm, debut = null, sections = sauve.sections;
  const affBpm = h("div", { class: "bpm" }, bpm ? String(bpm) : "—");
  const affMesure = h("p", { class: "muted", style: "text-align:center" });
  const corps = h("tbody");
  const chronoDebut = h("span", { class: "valeur" }, "0:00");
  const titre = h("input", { class: "champ", value: sauve.titre, placeholder: "Titre du morceau", "aria-label": "Titre du morceau", oninput: sauver });
  function sauver() { memoire.ecrire("ecoute", { titre: titre.value, bpm, sections }); }
  function majMesure() {
    affBpm.textContent = bpm ? String(bpm) : "—";
    affMesure.textContent = bpm ? `1 mesure = ${(240 / bpm).toFixed(2).replace(".", ",")} s · 8 mesures = ${Math.round(1920 / bpm)} s · 16 mesures = ${Math.round(3840 / bpm)} s` : "Tape au moins quatre fois, sur le kick.";
  }
  const tap = h("button", { class: "tap", type: "button", onpointerdown: e => {
    e.preventDefault();
    const t = performance.now();
    if (frappes.length && t - frappes[frappes.length - 1] > 2000) frappes = [];
    frappes.push(t); frappes = frappes.slice(-12);
    if (frappes.length >= 4) { bpm = Math.round(60000 / ((frappes[frappes.length - 1] - frappes[0]) / (frappes.length - 1))); sauver(); dessinerSections(); }
    majMesure();
  } }, "TAP");
  const NOMS = ["Intro", "Montée", "Breakdown", "Drop", "Couplet", "Refrain", "Pont", "Outro"];
  function dessinerSections() {
    corps.replaceChildren(...sections.map((s, k) => {
      const fin = k + 1 < sections.length ? sections[k + 1].t : null;
      const longueur = fin == null ? null : fin - s.t;
      return h("tr", null,
        h("td", { class: "mono" }, duree(s.t)),
        h("td", null, h("input", { value: s.nom, list: "noms-sections", "aria-label": "Nom de la section", oninput: e => { s.nom = e.target.value; sauver(); } })),
        h("td", { class: "mono" }, longueur == null ? "…" : `${Math.round(longueur)} s`),
        h("td", { class: "mono" }, longueur == null || !bpm ? "" : `≈ ${Math.round(longueur / (240 / bpm))} mes.`));
    }));
  }
  const marquer = h("button", { class: "btn", type: "button", onclick: () => {
    if (debut == null) return;
    const t = (Date.now() - debut) / 1000;
    sections.push({ t, nom: NOMS[Math.min(sections.length, NOMS.length - 1)] }); sauver(); dessinerSections();
  }, disabled: true }, "＋ Nouvelle section");
  const lancer = h("button", { class: "btn fantome", type: "button", onclick: () => {
    debut = Date.now(); sections = [{ t: 0, nom: "Intro" }]; marquer.disabled = false; lancer.textContent = "↺ Recommencer au début"; sauver(); dessinerSections();
  } }, "▶ Le morceau démarre");
  const tic = setInterval(() => { if (debut != null) chronoDebut.textContent = duree((Date.now() - debut) / 1000); }, 300);
  KIT.nettoyages.push(() => clearInterval(tic));
  majMesure(); dessinerSections();
  return h("div", null, barre("Écoute active", "oreille"),
    h("div", { class: "jeu" },
      h("div", { class: "bloc" },
        h("p", { style: "margin:0" }, "Lance un morceau dans ton appli de musique (téléchargé avant le vol). Tape le tempo sur le kick, puis appuie sur « Le morceau démarre » au début, et sur « Nouvelle section » à chaque changement : entrée d'un élément, breakdown, retour du kick. Tu verras combien de mesures dure chaque partie, comme dans tes notes d'arrangement.")),
      titre, tap, affBpm, affMesure,
      h("div", { class: "infos-jeu" }, h("span", null, "Depuis le début ", chronoDebut), lancer),
      marquer,
      h("datalist", { id: "noms-sections" }, NOMS.map(n => h("option", { value: n }))),
      h("table", { class: "sections-morceau" }, h("thead", null, h("tr", null, h("th", null, "Début"), h("th", null, "Section"), h("th", null, "Durée"), h("th", null, "Mesures"))), corps),
      h("p", { class: "astuce", style: "margin-top:10px" }, "Repère : en techno, les changements tombent presque toujours toutes les 8, 16 ou 32 mesures. Si tu trouves 15 ou 17, c'est sans doute ton appui qui a glissé.")));
};

KIT.demarrer();
</script>
